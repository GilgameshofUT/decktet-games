<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#113a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Adaman</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<header class="topbar">
  <a class="iconbtn" href="../index.html" aria-label="Back to home">‹</a>
  <h1>Adaman<span class="sub" id="subline">conspiracy and manipulation</span></h1>
  <button class="iconbtn" id="undo" aria-label="Undo last move" disabled>↶ Undo</button>
  <a class="iconbtn" href="../rules/adaman.html">Rules</a>
  <button class="iconbtn" id="new" aria-label="Start a new game">New</button>
</header>

<div class="status" id="status" role="status">Shuffling the deck…</div>

<section class="panel">
  <h2>Royal palace <span class="count" id="palaceCount"></span></h2>
  <div class="cardrow" id="palace"></div>
</section>

<section class="panel">
  <h2>The capital <span class="count" id="capitalCount"></span></h2>
  <div class="cardrow" id="capital"></div>
</section>

<section class="panel">
  <h2>Your resources <span class="count" id="resourceCount"></span></h2>
  <div class="cardrow" id="resources"></div>
</section>

<div class="piles">
  <div class="pile" id="deckPile"><span id="deckCount">0</span><small>deck</small></div>
  <div class="pile" id="discardPile"><span id="discardCount">0</span><small>discard</small></div>
  <div class="pilehint" id="scoreHint"></div>
</div>

<script type="module" src="../js/games/adaman.js"></script>
</body>
</html>
